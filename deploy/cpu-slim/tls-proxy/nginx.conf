# 本地测试用。后端只反代到回环上的小智 WebSocket。
# 令牌是这份配置里的静态 Bearer，不是 server.auth.token，也没有在生产机部署。
worker_processes 1;
error_log /tmp/xz-runtime/nginx-error.log;
pid /tmp/xz-runtime/nginx.pid;
events { worker_connections 64; }
http {
  server {
    listen 127.0.0.1:8443 ssl;
    ssl_certificate /tmp/xz-runtime/tls/cert.pem;
    ssl_certificate_key /tmp/xz-runtime/tls/key.pem;
    location /xiaozhi/v1/ {
      if ($http_authorization != "Bearer local-test-bearer") {
        return 401;
      }
      proxy_pass http://127.0.0.1:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 60s;
    }
  }
}
